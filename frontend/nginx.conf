server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .webmanifest isn't in nginx's default mime.types — served as
    # application/octet-stream, browsers ignore the install metadata and the
    # home-screen icon falls back to a screenshot. Scoped to the one file:
    # a server-level `types` block REPLACES the inherited map rather than
    # extending it, which would strip the types off every css/js asset.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths render the app shell.
    #
    # `no-cache` is the whole update path, not a detail. index.html is the one
    # file that names the current asset hashes, and it was being served with no
    # Cache-Control at all — which does not mean "don't cache", it means the
    # browser may invent its own lifetime. An installed iOS home-screen app
    # does exactly that, so it kept re-reading a stale shell, kept asking for
    # the asset hashes that shell named, and those ARE immutable and cached
    # forever below. Every deploy landed on the server and none of it reached
    # the phone.
    #
    # `no-cache` stores the file but revalidates before use: with nginx's ETag
    # that is a 304 and a couple of hundred bytes, and a new build is picked up
    # on the next open.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Long-cache immutable hashed assets. Safe precisely *because* the shell
    # above revalidates: the filename changes whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
