server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .webmanifest isn't in nginx's default mime.types — served as
    # application/octet-stream, browsers ignore the install metadata and the
    # home-screen icon falls back to a screenshot. Scoped to the one file:
    # a server-level `types` block REPLACES the inherited map rather than
    # extending it, which would strip the types off every css/js asset.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
